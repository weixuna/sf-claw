CONFIG_DRV_EPIC_NEW_API=y
CONFIG_RT_MAIN_THREAD_STACK_SIZE=4096
CONFIG_RT_MAIN_THREAD_PRIORITY=19
CONFIG_RT_USING_DFS_ELMFAT=y
CONFIG_RT_SERIAL_RB_BUFSZ=256
CONFIG_RT_USING_HWMAILBOX=y
CONFIG_RT_USING_ULOG=y
CONFIG_ULOG_OUTPUT_FLOAT=y
# CONFIG_ULOG_USING_COLOR is not set
CONFIG_ULOG_OUTPUT_THREAD_NAME=y
CONFIG_RT_USING_MEMHEAP=y
CONFIG_RT_USING_MEMTRACE=y
CONFIG_BSP_USING_FULL_ASSERT=y
CONFIG_GUI_APP_FRAMEWORK=y
CONFIG_USING_BUTTON_LIB=y
CONFIG_USING_CELL_TRANSFORM=y
CONFIG_USING_CPU_USAGE_PROFILER=y
CONFIG_PKG_USING_LITTLEVGL2RTT=y
CONFIG_LV_INDEV_DEF_READ_PERIOD=16
CONFIG_LV_IMG_CACHE_DEF_SIZE=16
CONFIG_LV_FONT_MONTSERRAT_12=y
# CONFIG_LV_FONT_MONTSERRAT_14 is not set
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_24=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_36=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_16=y
# CONFIG_LV_USE_THEME_DEFAULT is not set
# CONFIG_LV_USE_THEME_BASIC is not set
CONFIG_LV_USE_FS_POSIX=y
CONFIG_LV_FS_POSIX_LETTER=47
CONFIG_LV_USE_SJPG=y
CONFIG_LV_USE_QRCODE=y
CONFIG_LV_USING_FREETYPE_ENGINE=y
CONFIG_LV_EXT_RES_NON_STANDALONE=y
CONFIG_LV_FB_TWO_NOT_SCREEN_SIZE=y
CONFIG_LV_FB_LINE_NUM=50
# Move the rotation/image SRAM cache to PSRAM.  The 50KB SRAM image cache was
# pushing the system heap to exhaustion during TLS/AI + a full-screen redraw.
CONFIG_ROTATE_MEM_IN_PSRAM=y
# CONFIG_ROTATE_MEM_IN_SRAM is not set
CONFIG_IMAGE_CACHE_IN_PSRAM_SIZE=1100000
CONFIG_IMAGE_CACHE_IN_SRAM_SIZE=0

# Bluetooth PAN: Classic BT + lwIP
CONFIG_RT_USING_BLUETOOTH=y
CONFIG_BLUETOOTH=y
CONFIG_BSP_BLE_SIBLES=y
CONFIG_BSP_BLE_NVDS_SYNC=y
# CONFIG_NVDS_AUTO_UPDATE_MAC_ADDRESS is not set
CONFIG_BT_PROFILE_CUSTOMIZE=y
CONFIG_CFG_PAN=y
CONFIG_BT_FINSH=y
# CONFIG_BSP_BT_APP is not set
CONFIG_BSP_BT_CONNECTION_MANAGER=y
CONFIG_BT_AUTO_CONNECT_LAST_DEVICE=y
CONFIG_PKG_USING_FLASHDB=y

# lwIP network stack used by the PAN netif (b0)
CONFIG_RT_USING_LWIP=y
CONFIG_RT_USING_LWIP212=y
# The SiFli BT PAN example uses lwIP sockets directly.  Keeping SAL off
# also lets webclient use its mbedTLS client backend instead of SAL TLS,
# avoiding the SAL/lwIP socket header conflicts in webclient.
# CONFIG_RT_USING_SAL is not set
CONFIG_RT_USING_NETDEV=y
CONFIG_NETDEV_USING_IFCONFIG=y
CONFIG_RT_LWIP_DHCP=y
CONFIG_RT_LWIP_DNS=y
CONFIG_RT_LWIP_TCPTHREAD_STACKSIZE=4096
CONFIG_RT_LWIP_TCPTHREAD_MBOX_SIZE=48
CONFIG_RT_MEMP_NUM_NETCONN=16
CONFIG_RT_LWIP_TCP_PCB_NUM=8
CONFIG_RT_LWIP_UDP_PCB_NUM=8
CONFIG_RT_LWIP_RAW_PCB_NUM=8

# HTTPS for rt-claw: mbedTLS + webclient
CONFIG_PKG_USING_MBEDTLS=y
CONFIG_PKG_USING_MBEDTLS_USE_ALL_CERTS=y
CONFIG_PKG_USING_WEBCLIENT=y

# SNTP (needed for certificate validity checks)
CONFIG_PKG_USING_NETUTILS=y
CONFIG_PKG_NETUTILS_NTP=y

# rt-claw reusable SF32 port switches
CONFIG_RTCLAW_PORT_NET_WEBCLIENT=y
CONFIG_RTCLAW_PORT_KV_FLASHDB=y
CONFIG_RTCLAW_PORT_PSRAM=y
CONFIG_RTCLAW_PORT_PSRAM_SIZE=1048576
CONFIG_RTCLAW_PORT_SNTP=y
CONFIG_RTCLAW_AI_CONTEXT_SIZE=65536
CONFIG_RTCLAW_AI_MEMORY_MAX_MSGS=12
CONFIG_RTCLAW_TOOL_SYSTEM=y

# QuickJS: AI 生成的界面脚本运行时，使用独立 PSRAM 堆
CONFIG_PKG_USING_QUICKJS=y
CONFIG_QUICKJS_USING_PSRAM=y
CONFIG_QUICKJS_PSRAM_SIZE=524288
# CONFIG_QUICKJS_LVGL is not set
